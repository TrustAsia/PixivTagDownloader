# Aria2 RPC 配置示例文件
# 将此文件重命名为 aria2.yaml 并根据需要修改配置

# 是否启用 Aria2 RPC 下载
enabled: true

# Aria2 RPC 服务器地址
host: "localhost"

# Aria2 RPC 服务器端口
port: 6800

# 使用的协议 (http、https、ws 或 wss)
# - http/https: 标准 HTTP/HTTPS 协议
# - ws/wss: WebSocket 协议，适用于远程服务器或需要更好的连接稳定性
protocol: "http"

# RPC 路径 (通常为 /jsonrpc)
path: "/jsonrpc"

# RPC 密钥 (如果设置了 --rpc-secret)
# 如果未设置密钥，请将此值留空或删除此行
secret: ""

# 是否跳过 SSL 证书验证 (仅在使用 https 或 wss 协议时有效)
# 对于自签名证书设置为 true
skip_cert_verify: false

# Aria2 RPC 服务器的默认下载路径前缀
# 当使用远程 Aria2 RPC 服务器时，此路径将作为下载路径的前缀
# 例如：如果 Aria2 服务器的默认下载目录是 "/downloads"，则设置为 "/downloads"
# 如果不设置，则使用相对路径
download_path_prefix: ""

# 下载选项
options:
  # 最大同时下载数
  max_concurrent_downloads: 5

  # 单个文件最大连接数
  split: 5

  # 最小分片大小 (单位: 字节)
  min_split_size: "1M"

  # 下载位置 (如果为空，则使用程序的输出目录)
  # 如果指定，将覆盖程序的输出目录设置
  dir: ""

  # 用户代理
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

  # 是否启用断点续传
  continue: true

  # 最大重试次数
  max_tries: 5

  # 重试等待时间 (秒)
  retry_wait: 10

  # 连接超时时间 (秒)
  connect_timeout: 30

  # 是否遵循重定向
  follow_location: true

  # 最大重定向次数
  max_redirects: 5

  # 是否自动重命名文件
  auto_file_renaming: false
